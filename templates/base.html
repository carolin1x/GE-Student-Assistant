<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        GE Student Assistant
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🎓 GE Student Assistant</a>
        <div>
            {% if g.user %}
                <a href="/" class="btn btn-outline-light btn-sm me-2">🏠 Dashboard</a>
                <a href="/efm" class="btn btn-danger btn-sm me-2">🎯 EFM Center</a>
                <a href="/calculators" class="btn btn-primary btn-sm me-2">🧮 Calculatrices</a>
                <span class="text-white me-2">👤 <strong>{{ g.user['username'] }}</strong></span>
                <a href="/logout" class="btn btn-outline-danger btn-sm">Déconnexion</a>
            {% else %}
                <a href="/login" class="btn btn-outline-light btn-sm me-2">🔐 Connexion</a>
                <a href="/register" class="btn btn-success btn-sm">📝 Inscription</a>
            {% endif %}
        </div>
    </div>
</nav>


<main class="container py-5">

    {% block content %}
    {% endblock %}

</main>


<footer class="bg-dark text-white text-center py-3">

    <small>
        © 2026 GE Student Assistant
    </small>

</footer>

</body>

</html>
