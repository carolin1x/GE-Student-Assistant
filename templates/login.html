{% extends "base.html" %}

{% block title %}Connexion - GE Assistant{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4>🔐 Connexion - GE Assistant</h4>
            </div>
            <div class="card-body p-4">
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label class="form-label">Adresse Email</label>
                        <input type="email" name="email" class="form-control" required placeholder="exemple@gmail.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mot de passe</label>
                        <input type="password" name="password" class="form-control" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Se connecter</button>
                </form>
                
                <hr>
                <div class="text-center">
                    <p class="mb-1">Pas encore de compte ? <a href="/register">S'inscrire</a></p>
                    <small class="text-muted">Mot de passe oublié ? Contacte l'administration du centre.</small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
