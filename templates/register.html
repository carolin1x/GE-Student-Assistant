{% extends "base.html" %}

{% block title %}Inscription - GE Assistant{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-success text-white text-center">
                <h4>📝 Créer un compte</h4>
            </div>
            <div class="card-body p-4">
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="POST" action="/register">
                    <div class="mb-3">
                        <label class="form-label">Nom d'utilisateur</label>
                        <input type="text" name="username" class="form-control" required placeholder="Ex: yassine">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required placeholder="exemple@gmail.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mot de passe</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Créer mon compte</button>
                </form>
                <hr>
                <div class="text-center">
                    <p class="mb-0">Déjà un compte ? <a href="/login">Se connecter</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
